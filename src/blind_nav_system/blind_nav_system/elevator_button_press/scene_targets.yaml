# 씬별 목표 자세 (map 프레임). 비어 있으면 기존 하드코딩(SCENE_MOVES) 동작.
# 현장에서 POST /scene_teach {"n": 씬번호} 로 현재 자세를 저장한다.
#
# yaw_deg 규약: map 프레임 기준 도(°), -180~180. 쿼터니언이 아니다.
#   yaw = atan2(2(wz+xy), 1-2(yy+zz)) 를 도로 바꾼 값.
# 여기 값은 '목표 자세'일 뿐이고, 실제 이동량은 SCENE_MOVES 티칭값 ±40cm/±20°
# 클램프를 통과해야만 실행된다. 클램프를 벗어나면 로봇은 움직이지 않는다.
#
# 출처: 2026-09-02 사용자 수집 스냅샷의 amcl_pose.
targets:
  "1":                      # ② 문앞 정렬  (20260902T182520_엘리베이터탑승지점)
    x: -48.228
    y: 5.224
    yaw_deg: 83.3
  "3":                      # ④ 탑승 (9/2 수집_3~9, 버튼 사진 7장 찍은 자리)
    # 2026-09-04 교체 — 이전 목표는 20260902T183106 "탑승장소(좌표)"였는데, 그건
    # 18:31:06으로 버튼 촬영이 끝난 뒤 물러나서 찍은 자리다. 이름만 보고 오인했다.
    # 그 자리는 패널까지 0.775m라 팔 여유가 11cm뿐이고, 실주행에서는 0.827m까지
    # 깊게 들어가 팔이 최대(ARM_EXT_MAX)로 뻗고도 못 닿았다(도달 상한 0.887m).
    # 아래 값은 실제로 버튼 사진을 찍은 자리(패널까지 0.696m, 여유 19cm)다.
    # 이전 값(되돌릴 때 이걸로): x: -47.825 / y: 7.254 / yaw_deg: 74.7
    x: -47.819
    y: 7.057
    yaw_deg: 69.9
  "5":                      # ⑥ 하차 — ②문앞과 같은 자세 (2026-09-08 추가)
    # 이전 주석은 "location.yaml 하차지점(235.7cm) vs 티칭값 186cm, 둘 중 하나가
    # 낡았는데 지금 데이터로는 못 가른다"였다. 갈렸다 — 낡은 쪽은 하차지점이다.
    # 하드코딩 -186cm 가 실제로 가리키던 곳은 하차지점(44.0cm 어긋남)이 아니라
    # ②문앞(24.6cm)이었다. ④목표에서 ②문앞까지 직선 187.8cm 로 티칭값 186.0과
    # 1.8cm 차이다.
    # 재검산(2026-09-04 ④ 실제 종료 자세 map(-47.878,+7.266,+77.5°), 14:14:19.096):
    #   ②문앞   → 필요 후진 207.2cm, 티칭값과 21.2cm 차 → ±40cm 클램프 통과
    #   하차지점 → 필요 후진 236.1cm, 티칭값과 50.1cm 차 → 클램프 거부(안 움직인다)
    # ※ location.yaml 의 '엘리베이터 하차지점'은 이번에 고치지 않았다 — 다른 곳에서
    #   쓰는지 확인이 안 됐다.
    # ※ 되돌리려면 이 "5" 블록만 지우면 된다. 그러면 기존 하드코딩(-186cm)으로 돌아간다.
    #   좌표 경로가 클램프에 거부돼도 자동으로 그 하드코딩으로 폴백한다
    #   (SCENE_COORD_FALLBACK, ok 는 False 로 기록되고 로그에 ⚠⚠ 로 남는다).
    x: -48.228
    y: 5.224
    yaw_deg: 83.3
