# 씬별 목표 자세 (map 프레임). 비어 있으면 기존 하드코딩(SCENE_MOVES) 동작.
# 현장에서 POST /scene_teach {"n": 씬번호} 로 현재 자세를 저장한다.
#
# yaw_deg 규약: map 프레임 기준 도(°), -180~180. 쿼터니언이 아니다.
#   yaw = atan2(2(wz+xy), 1-2(yy+zz)) 를 도로 바꾼 값.
# 여기 값은 '목표 자세'일 뿐이고, 실제 이동량은 SCENE_MOVES 티칭값 ±40cm/±20°
# 클램프를 통과해야만 실행된다. 클램프를 벗어나면 로봇은 움직이지 않는다.
#
# 출처: 2026-09-02 사용자 수집 스냅샷. **map→base_link TF 값을 쓴다.**
#   /amcl_pose 를 쓰면 안 된다 — 그건 필터가 갱신될 때만 발행되고(update_min_d 0.15 /
#   update_min_a 0.1) 정지 중에는 아예 안 나온다. 즉 마지막 갱신 시점의 낡은 값이다.
#   (이 저장소가 세 군데에 적어 뒀다: main.py:235, scale_audit.py:21, compare.py:51-52)
#   컨트롤러(_map_pose)는 TF 로 재므로 목표도 TF 여야 같은 자를 쓰는 것이 된다.
#   실측 어긋남(reach_check.json amcl_vs_map_tf, 24쌍): 최대 193.2mm / 최대 5.371°.
# ※ 원래는 현장에서 POST /scene_teach 로 잡아야 한다(그쪽은 TF 를 쓴다). 아직 한 번도
#   쓰인 적이 없어(로그 [TEACH] 0건) 지금 값들은 스냅샷에서 손으로 옮긴 것이다.
targets:
  "1":                      # ② 문앞 정렬  (20260902T182520_엘리베이터탑승지점)
    x: -48.228
    y: 5.224
    yaw_deg: 83.3
  "3":                      # ④ 탑승 (9/2 수집_3~9, 버튼 사진 7장 찍은 자리)
    # 2026-09-08 정정 — yaw 69.9 → 75.19. 기존 값은 같은 스냅샷의 amcl_pose 였는데
    # 컨트롤러는 TF 로 잰다. 같은 스냅샷의 tf 는 위치가 1.3mm 로 사실상 일치하고
    # (막 움직인 직후라 amcl 이 신선했다) yaw 만 5.24~5.30° 어긋나 있었다.
    # 표본 7개의 tf: 위치 -47.8186 / 7.0582~7.0583 (폭 0.0/0.1mm — 사실상 한 점),
    #   yaw 75.14 / 75.14 / 75.19 / 75.19 / 75.20 / 75.19 / 75.19 (폭 0.06°)
    #   → 중앙값 75.19 를 쓴다. 평균(75.177)과 0.013° 차이라 어느 쪽이든 같지만,
    #     표본 7개 중 4개가 정확히 이 값이라 중앙값이 가장 대표적이다.
    # 위치는 안 바꾼다 — tf 와 1.3mm 차이라 바꿀 이유가 없다(yaw 만 정정).
    # 되돌릴 값: yaw_deg: 69.9
    # 효과(오늘 실기 시작 자세 map(-48.113,+5.318,+79.3°) 기준):
    #   ①정렬 +1.10° / ②주행 +176.5cm 는 그대로(위치가 같으니 당연하다)
    #   ③정렬이 닫아야 할 각이 -9.40° → -4.11° 로 줄어든다. 즉 로봇이 지금까지
    #   5.29° 틀어진 자세를 "목표"로 알고 거기에 정렬해 왔다.
    # 주행 클램프: |+176.5 - (+185.0)| = 8.5cm ≤ 40cm ✓ (정정 전 8.6cm, 사실상 동일)
    # 2026-09-04 교체 — 이전 목표는 20260902T183106 "탑승장소(좌표)"였는데, 그건
    # 18:31:06으로 버튼 촬영이 끝난 뒤 물러나서 찍은 자리다. 이름만 보고 오인했다.
    # 그 자리는 패널까지 0.775m라 팔 여유가 11cm뿐이고, 실주행에서는 0.827m까지
    # 깊게 들어가 팔이 최대(ARM_EXT_MAX)로 뻗고도 못 닿았다(도달 상한 0.887m).
    # 아래 값은 실제로 버튼 사진을 찍은 자리(패널까지 0.696m, 여유 19cm)다.
    # 이전 값(되돌릴 때 이걸로): x: -47.825 / y: 7.254 / yaw_deg: 74.7
    x: -47.819
    y: 7.057
    yaw_deg: 75.19
  "5":                      # ⑥ 하차 — ②문앞과 **같은 자세** (2026-09-08 추가 → 09-08 철회 → 09-09 재투입)
    # 사용자 결정: "하차도 문 앞 좌표로 통일하자". 그래서 "1" 과 같은 값이다.
    #
    # ■ 9/8 에 철회했던 이유는 '좌표가 틀려서'가 아니라 '완료 판정이 못 따라와서'다
    #   (91a3bfb). 대시보드 _elev_wait_exit_done 이 _EXIT_TARGET_CM = -186.0 하드코딩과
    #   scene_acc 누적을 비교했는데, 좌표 경로의 누적은 시작점에 따라 -147~-226cm 로
    #   변한다. 그래서 하필 좌표가 잘 될 때만 'stall' → 구조 절차가 돌았다.
    #   ⇒ 그 판정을 scene_result(seq·running·ok) 기반으로 바꾼 뒤 다시 넣는다.
    #
    # ■ 이전 주석("하차지점까지 235.7cm 라 ±40cm 클램프를 벗어난다")은 틀렸다.
    #   235.7cm 는 location.yaml '엘리베이터 하차지점' 기준이고(④목표에서 재면 216.5cm),
    #   사용자가 고른 목표는 ②문앞이다. ④목표(-47.819,7.057) → ②문앞(-48.228,5.224)
    #   직선거리 = 187.8cm. 티칭값 -186.0 과 1.8cm 차라 현재 ±40cm 클램프도 통과한다.
    #   (지도 all.pgm 실측으로 재검산: 2026-09-09)
    #
    # ■ ⚠ 이 값의 이득은 "④가 목표에 제대로 끝났을 때"만 나온다. ④가 미달로 끝나면
    #   여기서 필요한 후진량이 -147~-226cm 로 흩어져 ±40cm 를 벗어나고 하드코딩
    #   폴백(-186cm 맹목 후진)으로 떨어진다. 그건 이 목표의 실패가 아니라 주행 클램프가
    #   아직 '누적 상대'이기 때문이다 — 절대 상한 + map/odom 교차검증이 들어오면 풀린다.
    #   그때까지 폴백 빈도를 로그로 셀 것([AUTO] ⚠⚠ 씬5 좌표 경로 거부).
    #
    # ■ 안전장치는 ec49afe 로 이미 코드에 있다 — 씬5 전용 ①정렬 ±22° 클램프
    #   (SCENE_CLAMP_TURN_DEG_BY_SCENE) + 클램프 거부 시 하드코딩 폴백
    #   (SCENE_COORD_FALLBACK). ±22° 는 불가침이다: ⑥은 사람을 태우고 아무도 뒤를
    #   안 보는 유일한 후진 구간이고, 주행 클램프가 완화되면 거기 남는 유일한 실질 가드다.
    # ※ 되돌리려면 이 "5" 블록만 지우면 된다 → 기존 하드코딩(-186cm)으로 복귀.
    x: -48.228
    y: 5.224
    yaw_deg: 83.3
