locations:
 # 쿼터니언 ↔ yaw 변환은 손계산 대신 `blind_nav_system/coord_util.py` 를 쓴다
 # (`python3 coord_util.py <yaw>` → z/w). 2026-09-10 에 이 파일의 엘베 3항목을 그
 # 함수로 전수 재검산했고 주석의 yaw 와 0.0006° 안에서 일치했다 — 기존 손계산은 맞았다.
 # 🔴 **복도 쪽 호출 지점**이다 (yaw 168.4°, 복도를 보고 있다). 엘베 **안**이 아니다.
 #   캐빈 안 자리는 scene_targets.yaml "3"(씬 ④ 엘리베이터 안, yaw 75.19°)이고
 #   전혀 다른 장소다 — 예전에 씬 ④ 도 "탑승"이라 불러서 한 단어가 두 곳을 가리켰다.
 #   장소 3분류: 탑승지점(여기) / 문 앞(`엘리베이터 문앞`) / 엘리베이터 안(씬 "3").
 엘리베이터 탑승지점:
   # 2026-09-04 갱신 — 팔이 호출버튼에 안 닿아서(로그 [PRESS] →0.500m = ARM_EXT_MAX
   # 클램프) 9/2 실측 '누르는 지점'으로 옮김. 출처: 스냅샷
   # 20260902T182307_5층버튼누르는지점 의 amcl_pose (yaw 168.4°
   # → z=sin(84.2°)=0.994881, w=cos(84.2°)=0.101056).
   # 이전 값(되돌릴 때 이걸로): x: -47.668 / y: 4.9445 / z: 0.997774 / w: 0.0666855
   x: -47.454
   y: 4.993
   z: 0.994881
   w: 0.101056

 엘리베이터 문앞:
   # ② 문앞 정렬의 목표 자세 — scene_targets.yaml "1"(= "5") 과 **같은 지점**이다.
   #   x/y 는 그대로 옮겼고 yaw_deg 83.3° 를 쿼터니언으로 바꿨다:
   #   z = sin(83.3/2°) = 0.664579 · w = cos(83.3/2°) = 0.747218
   # 2026-09-09: ② 를 3단 안무 → Nav2 주행으로 바꾸면서 추가(C안).
   #   지도 all.pgm 실측으로 현재 Nav2 파라미터 그대로 통과함을 확인했다 —
   #   목표 자세 footprint 충돌 0셀 · 승차지점→여기 80.8cm 스윕 0셀 ·
   #   필요 회전(168.4°→83.3°, 최단 -85.1°)이 충돌 각도대(210~320°)를 지나지 않음.
   #   ④ 탑승·⑥ 하차는 Nav2 로 넘기지 않는다 — footprint 뒤 0.9m 꼬리는 동반자를
   #   코스트맵에서 지우는 장치(footprint_clearing_enabled)라, 캐빈 선회를 얻으려고
   #   줄이면 로봇을 잡고 있는 시각장애인이 장애물이 된다.
   # ⚠ interface.py 는 이 파일을 **init 에 한 번만** 읽는다(load_locations, :1177).
   #   이 항목을 추가·수정한 뒤에는 interface 를 재시작해야 /goto 가 받는다.
   x: -48.228
   y: 5.224
   z: 0.664579
   w: 0.747218

 엘리베이터 하차지점:
   x: -48.232
   y: 4.9318
   z: 0.610832
   w: 0.79176

 # ── 호실 좌표: 2026-11-11 층별 지도(floor5 좌표계)에서 새로 찍음 (tools 좌표찍기 도구, 로봇 모양 벽 여유 검사 통과)
 #    방향 = 도착 후 로봇이 바라보는 방향. 이전 값(1~4층은 5층 복사본)은 git 기록에 있다.

